events {}

http {
    upstream backend {
        server app-01:8080 max_fails=1 fail_timeout=5s;
        server app-02:8080 max_fails=1 fail_timeout=5s;
        server app-03:8080 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
        }
    }
}